<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8"/>
        <title>AutoFill Forms - Settings</title>
    </head>
    <body>
        <h1>Your Profile</h1>
        <form id="profileForm">
            <label>First name <input type="text" id="first_name" /></label><br/>
            <label>Last name <input type="text" id="last_name" /></label><br/>
            <label>Email <input type="text" id="email" /></label><br/>
            <label>Phone <input type="text" id="phone" /></label><br/>
            <label>DOB <input type="text" id="dob" /></label><br/>
            <label>Street address <input type="text" id="street_address" /></label><br/>
            <label>City <input type="text" id="city" /></label><br/>
            <label>State <input type="text" id="state" /></label><br/>
            <label>ZIP <input type="text" id="zip" /></label><br/>
            <label>Country <input type="text" id="country" /></label><br/>
            <label>Employer <input type="text" id="employer" /></label><br/>
            <label>Job title <input type="text" id="job_title" /></label><br/>  
            <button type="submit">Save</button>
        </form>
        <span id="saveStatus"></span>
        <script src="schema.js"></script>
        <script src="options.js"></script>
    </body>
</html>
